# Railway Nixpacks Configuration
# This file tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ['nodejs_20']
aptPkgs = [
  'python3',
  'python3-venv',
  'python3-pip',
  'libstdc++6',
  'libgl1',
  'libglib2.0-0',
  'libsm6',
  'libxext6',
  'libxrender-dev',
  'libgomp1',
  'libgthread-2.0-0'
]

[phases.install]
cmds = [
  'npm ci --legacy-peer-deps',
  'python3 -m venv /opt/venv',
  '/opt/venv/bin/pip install --no-cache-dir --upgrade pip',
  '/opt/venv/bin/pip install --no-cache-dir -r requirements.txt'
]

[phases.build]
cmds = ['npm run build']

[start]
cmd = '. /opt/venv/bin/activate && npm run start'
