# Railway Nixpacks Configuration
# This file tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ['nodejs_20', 'python310', 'python310Packages.pip']

[phases.install]
cmds = [
  'npm install',
  'python3 -m venv /opt/venv',
  '. /opt/venv/bin/activate && pip install -r requirements.txt'
]

[phases.build]
cmds = ['npm run build']

[start]
cmd = '. /opt/venv/bin/activate && npm run start'
